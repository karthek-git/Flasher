plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.20'
    id 'com.mikepenz.aboutlibraries.plugin'
}

android {

    namespace 'com.karthek.android.s.flasher'

    compileSdk 36

    defaultConfig {
        applicationId "com.karthek.android.s.flasher"
        minSdk 21
        targetSdk 36
        versionCode 11
        versionName "1.0.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {

        debug {
            applicationIdSuffix ".debug"
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            exclude "DebugProbesKt.bin"
            exclude 'META-INF/*.version'
        }
    }
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
}

dependencies {

    def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
    implementation composeBom
    debugImplementation composeBom
    androidTestImplementation composeBom

    implementation "androidx.compose.material3:material3:1.3.2"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.navigation3:navigation3-runtime:1.0.0-alpha05"
    implementation "androidx.navigation3:navigation3-ui:1.0.0-alpha05"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-navigation3:1.0.0-alpha03'
    implementation "androidx.work:work-runtime-ktx:2.10.3"

    implementation "org.jetbrains.kotlinx:kotlinx-serialization-core:1.9.0"

    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "com.google.accompanist:accompanist-systemuicontroller:0.36.0"

    implementation "com.mikepenz:aboutlibraries-core:12.2.4"
    implementation "me.jahnen.libaums:core:0.10.0"
    implementation "me.jahnen.libaums:libusbcommunication:0.3.0"

    implementation "com.google.android.gms:play-services-ads:23.6.0"
}
