libaums-libusbcommunication = { module = "me.jahnen.libaums:libusbcommunication", version.ref = "libaumsLibusb" }
google-ads-gma = { module = "com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk", version.ref = "googleAdsGMA" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose ={ id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutlibraries" }